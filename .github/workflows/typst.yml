name: Typst validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python tooling
        run: uv sync

      - name: Install Typst 0.15.1
        run: |
          mkdir -p "$RUNNER_TEMP/typst"
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/typst"
          echo "$RUNNER_TEMP/typst" >> "$GITHUB_PATH"

      - name: Static validation and compile examples
        run: bash scripts/test-local.sh
